name: Documentation coverage preflight
on:
  push:
    branches: [codex/docs-coverage-preflight]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        candidate: [adme, fileshares]
    env:
      TESTED_SHA: ${{ matrix.candidate == 'adme' && 'c82c61ae157a42f593e541d68c6b3325274160f7' || '128cc0cb029ea0e0a1ccead7aae4bae5dfbf6d25' }}
      AZURE_MCP_COLLECT_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TESTED_SHA }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.401'
      - name: Verify source revision
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:TESTED_SHA) { throw 'Unexpected tested revision' }
          Write-Host "Tested SHA: $env:TESTED_SHA"
      - name: Run server tests with upstream coverage collection
        shell: pwsh
        run: |
          ./eng/scripts/Test-Code.ps1 -Paths Azure.Mcp.Server -TestType Unit -CollectCoverage
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run File Shares tests with upstream coverage collection
        if: matrix.candidate == 'fileshares'
        shell: pwsh
        run: |
          ./eng/scripts/Test-Code.ps1 -Paths FileShares -TestType Unit -CollectCoverage
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-${{ matrix.candidate }}
          path: .work/tests
